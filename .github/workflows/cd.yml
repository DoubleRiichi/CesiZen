name: CD - Build, Push & Deploy

on:
  push:
    branches:
      - master        

concurrency:
  group: cd-master
  cancel-in-progress: false   # ne jamais interrompre un déploiement en cours

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cesizen_api/Dockerfile
          push: true
          tags: |
            ghcr.io/doubleriichi/cesizen-api:latest
            ghcr.io/doubleriichi/cesizen-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Front
        uses: docker/build-push-action@v6
        with:
          context: ./cesizen-app
          file: cesizen-app/Dockerfile
          push: true
          tags: |
            ghcr.io/doubleriichi/cesizen-front:latest
            ghcr.io/doubleriichi/cesizen-front:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============ STAGE 2 : DEPLOY (séparé, dépend du stage 1) ============
  deploy:
    needs: build-and-push
    runs-on: self-hosted      
    environment: production  
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le .env de prod (depuis les secrets)
        run: |
          cat > .env <<EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}
          FRONT_ORIGIN=${{ secrets.FRONT_ORIGIN }}
          EOF

      - name: Login GHCR (sur le runner local)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Récupérer les nouvelles images
        run: docker compose -f docker-compose.deploy.yaml pull

      - name: Redéploiement propre (sans toucher au volume)
        run: docker compose -f docker-compose.deploy.yaml up -d --remove-orphans

      - name: Nettoyer les images orphelines
        run: docker image prune -f

      - name: Vérifier la santé de l'API
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health; then
              echo "✅ API en ligne"; exit 0
            fi
            echo "⏳ attente API..."; sleep 3
          done
          echo "❌ API indisponible après déploiement"; exit 1