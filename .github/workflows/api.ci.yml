name: Rust API CI

on:
  pull_request:
    branches:
      - "backend/**"

jobs:
  test_api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test_db
      DATABASE_TEST_URL: postgres://test:test@localhost:5432/test_db
      JWT_SECRET: ci_secret_suffisamment_long_pour_jwt_32chars

    defaults:
      run:
        working-directory: cesizen_api

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cesizen_api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('cesizen_api/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Run migrations
        run: sqlx migrate run

      - name: Clippy (warnings as errors)
        run: cargo clippy -- -D warnings

      - name: Run unit tests
        run: cargo test

#      - name: Run integration tests
#        run: cargo test --features integration