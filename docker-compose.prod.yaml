name: cesizen-prod

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # pas de "ports:" -> la db reste interne au réseau docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: cesizen_api/Dockerfile      # version prod (runtime allégé, voir plus bas)
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  front:
    build:
      context: ./cesizen-app
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - api
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL}   # ex : https://api.mondomaine.fr
      ORIGIN: ${FRONT_ORIGIN}             # ex : https://mondomaine.fr
    ports:
      - "3000:3000"

volumes:
  postgres_data: