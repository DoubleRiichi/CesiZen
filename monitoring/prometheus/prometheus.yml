# Configuration Prometheus — CESIZen
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus se surveille lui-même
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métriques du serveur hôte (CPU, RAM, disque, réseau)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Métriques par conteneur Docker
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Sonde HTTP interne : endpoint /health de l'API via le réseau applicatif
  - job_name: blackbox-api
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8080/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Sonde HTTP interne : le front répond
  - job_name: blackbox-front
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://front:3000/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
