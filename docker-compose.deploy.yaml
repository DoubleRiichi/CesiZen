name: cesizen-prod  

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/doubleriichi/cesizen-api:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    command: ["migrate-and-serve"]   # applique SEULEMENT les nouvelles migrations, puis sert
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  front:
    image: ghcr.io/doubleriichi/cesizen-front:latest
    restart: always
    depends_on:
      - api
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      ORIGIN: ${FRONT_ORIGIN}
    ports:
      - "3000:3000"

volumes:
  postgres_data: